<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mamak Mayhem</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#05070d;font-family:Rajdhani,sans-serif;color:#fff;touch-action:none}
canvas{display:block}
.hid{display:none!important}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#1b2a44,#05070d 70%);z-index:20;padding:16px;overflow:auto}
h1{font-family:'Bebas Neue';font-size:clamp(48px,10vw,96px);margin:0;letter-spacing:3px;color:#5dff8a;text-shadow:0 0 18px #2dff6a,0 0 40px #0a8a3a;font-style:italic}
.sub{opacity:.75;margin-bottom:24px;font-size:18px}
.btn{font-family:'Bebas Neue';font-size:26px;letter-spacing:1px;padding:10px 28px;margin:6px;border:none;border-radius:6px;background:#ffd23f;color:#111;cursor:pointer;transform:skewX(-10deg);box-shadow:0 4px 0 #a8820e}
.btn.alt{background:#2b3a55;color:#fff;box-shadow:0 4px 0 #111a2a}
.btn:active{transform:skewX(-10deg) translateY(3px);box-shadow:none}
input.code{font-family:'Bebas Neue';font-size:30px;width:150px;text-align:center;padding:6px;border-radius:6px;border:2px solid #ffd23f;background:#0b1120;color:#fff;letter-spacing:4px}
#heroes{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:980px}
.hero{width:170px;background:linear-gradient(160deg,#25365a,#101828);border:2px solid #34507f;border-radius:10px;padding:10px;cursor:pointer;transform:skewX(-4deg);transition:.15s}
.hero:hover{border-color:#ffd23f;transform:skewX(-4deg) translateY(-4px)}
.hero.taken{opacity:.35;pointer-events:none}
.hero img{width:100%;border-radius:6px;display:block}
.hero b{font-family:'Bebas Neue';font-size:30px;display:block;margin-top:6px}
.hero i{font-style:normal;color:#ffd23f;font-weight:700}
.hero p{margin:4px 0 0;font-size:14px;opacity:.85;line-height:1.15}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#cross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #0008}
#room{position:absolute;left:10px;top:8px;font-weight:700;font-size:16px;text-shadow:0 1px 2px #000;pointer-events:auto}
#room span{color:#ffd23f;font-family:'Bebas Neue';font-size:24px;letter-spacing:2px}
#plist{font-size:14px;opacity:.9}
#bill{position:absolute;left:10px;bottom:10px;background:#000a;padding:8px 12px;border-left:4px solid #ffd23f;font-weight:700;font-size:16px;transform:skewX(-6deg)}
#prompt{position:absolute;left:50%;top:62%;transform:translateX(-50%);background:#000b;padding:6px 14px;border-radius:4px;font-weight:700;font-size:18px;white-space:nowrap}
#prompt:empty{display:none}
#hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-size:14px;opacity:.75;text-shadow:0 1px 2px #000;text-align:center}
#toasts{position:absolute;right:10px;top:8px;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.toast{background:#000b;padding:5px 12px;border-right:4px solid #5dff8a;font-weight:700;animation:tin .25s}
@keyframes tin{from{transform:translateX(30px);opacity:0}}
#banner{position:absolute;left:0;right:0;top:22%;text-align:center;font-family:'Bebas Neue';font-size:clamp(34px,7vw,70px);color:#ffd23f;text-shadow:0 0 12px #000,0 3px 0 #a8820e;font-style:italic}
#banner small{display:block;font-family:Rajdhani;font-size:22px;color:#fff;font-style:normal}
#chatlog{position:absolute;left:10px;bottom:58px;width:min(360px,60vw);font-size:15px;font-weight:700;text-shadow:0 1px 2px #000}
#chatlog div{animation:tin .2s}
#chatin{position:absolute;left:10px;bottom:56px;width:min(360px,70vw);pointer-events:auto;font-family:Rajdhani;font-size:16px;padding:6px;border:2px solid #ffd23f;background:#000c;color:#fff;border-radius:4px}
#fps{position:absolute;right:10px;bottom:6px;font-size:12px;opacity:.7}
.modal{position:fixed;inset:0;z-index:30;background:#000a;display:flex;align-items:center;justify-content:center;padding:10px}
.panel{background:linear-gradient(160deg,#1c2a46,#0c1322);border:2px solid #ffd23f;border-radius:10px;padding:14px 18px;max-width:760px;width:100%;max-height:92vh;overflow:auto}
.panel h2{font-family:'Bebas Neue';font-size:38px;margin:0 0 6px;color:#ffd23f;letter-spacing:1px}
.cat{font-family:'Bebas Neue';font-size:22px;margin:10px 0 4px;color:#5dff8a}
.items{display:flex;flex-wrap:wrap;gap:6px}
.it{background:#26385e;border:2px solid transparent;border-radius:6px;padding:5px 9px;cursor:pointer;font-weight:700;font-size:15px}
.it.sel{border-color:#ffd23f;background:#4a3d12}
.it small{color:#ffd23f;margin-left:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.set label{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0;font-weight:700}
.set input[type=range]{width:55%}
#touch{position:fixed;inset:0;z-index:6;pointer-events:none}
.tb{position:absolute;pointer-events:auto;border-radius:50%;background:#0008;border:2px solid #fff6;display:flex;align-items:center;justify-content:center;font-size:calc(var(--bs)*.42);width:var(--bs);height:var(--bs);color:#fff;font-family:'Bebas Neue'}
.tb:active,.tb.on{background:#ffd23f99}
#stick{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid #fff5;display:none;pointer-events:none}
#stick i{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#fff6}
#wheel{width:min(80vw,360px);height:min(80vw,360px)}
</style>
</head>
<body>
<div id="start" class="scr">
  <h1>MAMAK MAYHEM</h1>
  <div class="sub">AZ Imran Bistro · Buka 24 Jam</div>
  <div id="stMain">
    <div class="row" style="justify-content:center"><button class="btn" id="bHost">HOST</button><button class="btn alt" id="bSolo">PLAY SOLO</button></div>
    <div class="row" style="justify-content:center;margin-top:14px"><input class="code" id="codeIn" maxlength="4" placeholder="CODE" inputmode="numeric"><button class="btn alt" id="bJoin">JOIN</button></div>
  </div>
  <div id="stMsg" style="margin-top:14px;font-weight:700;min-height:22px"></div>
</div>
<div id="pick" class="scr hid">
  <h1 style="font-size:56px">PILIH HERO</h1>
  <div class="sub" id="pickSub"></div>
  <div id="heroes"></div>
</div>
<div id="hud" class="hid">
  <div id="cross"></div>
  <div id="room"></div>
  <div id="toasts"></div>
  <div id="banner"></div>
  <div id="chatlog"></div>
  <div id="bill"></div>
  <div id="prompt"></div>
  <div id="hint"></div>
  <div id="fps"></div>
</div>
<input id="chatin" class="hid" maxlength="80" placeholder="Cakap something... (Enter)">
<div id="touch" class="hid"><div id="stick"><i></i></div></div>
<div id="orderM" class="modal hid"><div class="panel">
  <h2>BOSS, MAKAN APA?</h2><div id="menuList"></div>
  <div class="row"><b>Minuman:</b><span class="it" id="opHot">Panas</span><span class="it" id="opIce">Ais</span><span class="it" id="opGlass">Gelas</span><span class="it" id="opBag">Ikat Tepi</span></div>
  <div class="row"><button class="btn" id="bOrder">ORDER!</button><button class="btn alt" id="bNo">TAK APA</button><span id="oSum" style="font-weight:700"></span></div>
</div></div>
<div id="emoteM" class="modal hid"><div class="panel" style="max-width:420px"><h2>EMOTE</h2><div class="items" id="emList"></div></div></div>
<div id="setM" class="modal hid"><div class="panel set" style="max-width:480px">
  <h2>SETTINGS</h2>
  <label>Mouse sensitivity <input type="range" id="sSens" min="0.2" max="3" step="0.05"></label>
  <label>Touch look sensitivity <input type="range" id="sTSens" min="0.2" max="3" step="0.05"></label>
  <label>Field of view <input type="range" id="sFov" min="60" max="110" step="1"></label>
  <label>Volume <input type="range" id="sVol" min="0" max="1" step="0.05"></label>
  <label>Touch button size <input type="range" id="sBtn" min="44" max="96" step="2"></label>
  <label>Invert Y <input type="checkbox" id="sInv"></label>
  <label>Render resolution <input type="range" id="sRes" min="300" max="900" step="30"></label>
  <label>Show FPS <input type="checkbox" id="sFps"></label>
  <div class="row"><button class="btn" id="bSetOk">RESUME</button><button class="btn alt" id="bLeave">LEAVE</button></div>
  <div style="opacity:.7;font-size:14px">PC: WASD move · Shift sprint · Space jump · E interact · G call waiter · LMB eat · RMB drink · 1-6 emotes · Enter chat · Esc menu</div>
</div></div>
<div id="rouM" class="modal hid"><div style="text-align:center"><canvas id="wheel" width="360" height="360"></canvas><div id="rouTxt" style="font-family:'Bebas Neue';font-size:40px;color:#ffd23f"></div></div></div>

function noise(d,v,ft,ff,q,dl,ff2,dest,att){const t=AC.currentTime+(dl||0),s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;s.loop=true;f.type=ft;f.frequency.setValueAtTime(ff,t);if(ff2)f.frequency.exponentialRampToValueAtTime(ff2,t+d);f.Q.value=q||1;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+(att||.005));g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(dest);s.start(t,Math.random());s.stop(t+d+.05);}

/* ---------- networking ---------- */
const NET={mode:null,peer:null,conns:{},host:null,myId:'h',code:null,pidc:0};
function send(c,o){try{if(c&&c.open)c.send(o)}catch(e){}}
function bcast(o){for(const id in NET.conns)send(NET.conns[id],o);}
function stMsg(t){$('#stMsg').textContent=t;}
function startHost(retry){if(!window.Peer){stMsg('Online library failed to load. Check internet.');return}
 const code=String(1000+Math.floor(Math.random()*9000));stMsg('Creating room...');
 const peer=new Peer('azimranmamak-'+code);NET.peer=peer;
 peer.on('open',()=>{NET.mode='host';NET.code=code;NET.myId='h';showPick();});
 peer.on('error',e=>{if(e.type==='unavailable-id'&&(retry||0)<4){peer.destroy();startHost((retry||0)+1)}else if(NET.mode!=='host')stMsg('Error: '+e.type);});
 peer.on('connection',c=>{c.on('open',()=>{const id='p'+(++NET.pidc);c.pid=id;NET.conns[id]=c;send(c,{t:'welcome',id,taken:taken()});});
  c.on('data',d=>hostRecv(c.pid,d));c.on('close',()=>{const p=W.players[c.pid];delete NET.conns[c.pid];if(p){emitEv({k:'toast',txt:HEROES[p.h].name+' balik dulu 👋'});delete W.players[c.pid];delete W.plates[c.pid];if(W.card===c.pid)W.card=null;}});});
}
function startJoin(code){if(!window.Peer){stMsg('Online library failed to load. Check internet.');return}
 if(!/^\d{4}$/.test(code)){stMsg('Enter the 4-digit room code');return}stMsg('Joining '+code+'...');
 const peer=new Peer();NET.peer=peer;
 NET.code=code;peer.on('open',()=>{const c=peer.connect('azimranmamak-'+code,{reliable:true});NET.host=c;
  c.on('data',clientRecv);c.on('close',()=>{if(NET.mode==='client'){alert2('Host left the mamak 😢');setTimeout(()=>location.reload(),2500)}});});
 peer.on('error',e=>{stMsg(e.type==='peer-unavailable'?'Room '+code+' not found':'Error: '+e.type)});
}
function taken(){return Object.values(W.players).map(p=>p.h);}
function hostRecv(pid,d){
 if(d.t==='hello'){if(taken().includes(d.h)){send(NET.conns[pid],{t:'taken',taken:taken()});return}W.players[pid]={h:d.h,p:[0,0,0],r:[0,0],s:d.h};send(NET.conns[pid],{t:'ok'});emitEv({k:'toast',txt:HEROES[d.h].name+' dah sampai! 🛵'});return}
 if(d.t==='st'){const p=W.players[pid];if(p)Object.assign(p,d.s);return}
 if(d.t==='act')hostAct(pid,d.a);
}
function clientRecv(d){
 if(d.t==='welcome'){NET.mode='client';NET.myId=d.id;showPick(d.taken);return}
 if(d.t==='taken'){showPick(d.taken);$('#pickSub').textContent='Someone just took that hero — pick another';return}
 if(d.t==='ok'){enterGame();return}
 if(d.t==='s'){W=d.w;return}
 if(d.t==='ev')onEv(d.ev);
}
function act(a){if(NET.mode==='client')send(NET.host,{t:'act',a});else hostAct(NET.myId,a);}
function emitEv(ev){bcast({t:'ev',ev});onEv(ev);}

/* ---------- host logic ---------- */
function hasXQ(){return Object.values(W.players).some(p=>p.h===1);}
function payerId(){if(hasXQ())return Object.keys(W.players).find(k=>W.players[k].h===1);return W.payer&&W.players[W.payer]?W.payer:null;}
function seatPos(h){return{x:TABLE.x+SEATS[h][0],z:SEATS[h][1]};}
function hostAct(pid,a){const p=W.players[pid];if(!p)return;const nm=HEROES[p.h].name;
 switch(a.k){
 case 'call':{const w=W.waiter;if(w.m==='idle'){w.m='toTable';w.path=[[4.8,-4],[TABLE.x+1.9,TABLE.z+.2]];emitEv({k:'say',who:'w',txt:'Ya boss, datang!'});}else w.queued=1;emitEv({k:'toast',txt:nm+': "Boss! Order!" 🙋'});break;}
 case 'order':{if(W.waiter.m!=='taking')return;W.pending=W.pending.filter(o=>o.pid!==pid);if(a.f||a.d)W.pending.push({pid,f:a.f,d:a.d,di:a.di,db:a.db});W.waiter.ordered=W.waiter.ordered||{};W.waiter.ordered[pid]=1;emitEv({k:'say',who:'w',txt:WAITER_LINES.ok[Math.floor(Math.random()*3)]});break;}
 case 'bite':{const pl=W.plates[pid];if(pl&&pl.fl>0){pl.fl--;emitEv({k:'sfx',n:'bite',pid});}break;}
 case 'sip':{const pl=W.plates[pid];if(pl&&pl.dl>0){pl.dl--;emitEv({k:'sfx',n:'sip',pid});}break;}
 case 'card':{const pay=payerId();if(W.card)return;if(!pay){emitEv({k:'toast',txt:'Pusing roulette dulu! 🎡',to:pid});return}if(pay!==pid){emitEv({k:'toast',txt:'Bukan kau bayar lah 😤',to:pid});return}W.card=pid;emitEv({k:'toast',txt:nm+' ambil order card 📋'});break;}
 case 'pay':{if(W.card!==pid)return;if(W.bill<=0){emitEv({k:'toast',txt:'Belum order apa-apa lagi lah boss',to:pid});return}const amt=W.bill;W.bill=0;W.plates={};W.card=null;W.payer=null;W.pending=[];emitEv({k:'paid',who:nm,amt});break;}
 case 'spin':{if(hasXQ()||W.payer||W.spinning)return;const ids=Object.keys(W.players);const win=ids[Math.floor(Math.random()*ids.length)];W.spinning=1;emitEv({k:'roulette',names:ids.map(i=>HEROES[W.players[i].h].name),win:ids.indexOf(win)});setTimeout(()=>{W.payer=win;W.spinning=0;},4300);break;}
 case 'pet':{const c=W.cats[a.i];if(c){c.m='sit';c.t=3;emitEv({k:'pet',i:a.i});}break;}
 case 'flush':emitEv({k:'sfx',n:'flush',pos:{x:7.3,z:-11.5}});break;
 case 'chat':emitEv({k:'chat',pid,txt:String(a.txt).slice(0,80)});break;
 }}
function walkTo(o,x,z,sp,dt){const dx=x-o.x,dz=z-o.z,d=Math.hypot(dx,dz);if(d<.08)return true;const s=Math.min(d,sp*dt);o.x+=dx/d*s;o.z+=dz/d*s;o.ry=Math.atan2(dx,dz);o.mv=sp;return false;}
function followPath(o,sp,dt){if(!o.path||!o.path.length)return true;const p=o.path[0];if(walkTo(o,p[0],p[1],sp,dt))o.path.shift();return !o.path.length;}
let tvGoalT=rnd(40,80),snapT=0;
function hostTick(dt){
 const w=W.waiter;w.mv=0;
 if(w.m==='toTable'){if(followPath(w,2.2,dt)){w.m='taking';w.tk=30;w.sid++;w.ordered={};W.pending=[];w.ry=-Math.PI/2;emitEv({k:'say',who:'w',txt:WAITER_LINES.call[Math.floor(Math.random()*3)]});}}
 else if(w.m==='taking'){w.tk-=dt;const ids=Object.keys(W.players);const done=ids.every(i=>w.ordered[i]);if(done||w.tk<=0){if(W.pending.length){w.m='toKitchen';w.path=[[4.8,-4],[4.8,-10.8]];}else{w.m='back';w.path=[[4.8,-4],[4.8,-10.8]];}}}
 else if(w.m==='toKitchen'){if(followPath(w,2.4,dt)){w.m='cook';w.tk=6;}}
 else if(w.m==='cook'){w.tk-=dt;if(w.tk<=0){w.m='deliver';w.path=[[4.8,-4],[TABLE.x+1.9,TABLE.z+.2]];}}
 else if(w.m==='deliver'){if(followPath(w,2.0,dt)){W.pending.forEach(o=>{if(!W.players[o.pid])return;const old=W.plates[o.pid]||{};const pl={...old};if(o.f){pl.f=o.f;pl.fl=8;W.bill+=FMAP[o.f][2];}if(o.d){const dd=DMAP[o.d];pl.d=o.d;pl.dl=6;pl.di=o.di||!dd[2];pl.db=o.db;W.bill+=pl.di?dd[3]:dd[2];}W.plates[o.pid]=pl;});W.pending=[];W.bill=Math.round(W.bill*100)/100;emitEv({k:'say',who:'w',txt:WAITER_LINES.serve[Math.floor(Math.random()*3)]});w.m='back';w.path=[[4.8,-4],[4.8,-10.8]];}}
 else if(w.m==='back'){if(followPath(w,2.4,dt)){w.m='idle';w.ry=0;if(w.queued){w.queued=0;w.m='toTable';w.path=[[4.8,-4],[TABLE.x+1.9,TABLE.z+.2]];}}}
 // cats
 W.cats.forEach(c=>{c.mv=0;c.t-=dt;
  if(c.m==='wander'){if(walkTo(c,c.tx,c.tz,.8,dt)){c.mv=0;if(c.t<=0){c.tx=rnd(-8,8);c.tz=rnd(-2.5,7);c.t=rnd(3,8);
     // try to steal
     for(const id in W.plates){const pl=W.plates[id],pp=W.players[id];if(!pp||!pl.fl)continue;const sp=seatPos(pp.h);if(Math.hypot(pp.p[0]-sp.x,pp.p[2]-sp.z)>3&&Math.random()<.6){c.m='steal';c.vid=id;c.tx=sp.x+(TABLE.x-sp.x)*.45;c.tz=sp.z+(TABLE.z-sp.z)*.45;break;}}}}}
  else if(c.m==='steal'){const pp=W.players[c.vid];if(!pp||!W.plates[c.vid]){c.m='wander';return}const sp=seatPos(pp.h);if(Math.hypot(pp.p[0]-sp.x,pp.p[2]-sp.z)<1.2){c.m='flee';c.tx=rnd(-8,8);c.tz=8;emitEv({k:'sfx',n:'meow',pos:{x:c.x,z:c.z}});return}
   if(walkTo(c,c.tx,c.tz,1.4,dt)){const pl=W.plates[c.vid];pl.fl=Math.max(0,pl.fl-3);emitEv({k:'toast',txt:'🐈 Kucing curi makanan '+HEROES[pp.h].name+'!'});emitEv({k:'sfx',n:'meow',pos:{x:c.x,z:c.z}});c.m='flee';c.tx=rnd(-8,8);c.tz=8;}}
  else if(c.m==='flee'){if(walkTo(c,c.tx,c.tz,3,dt)){c.m='wander';c.t=rnd(5,10);}}
  else if(c.m==='sit'){if(c.t<=0){c.m='wander';c.t=2}}
 });
 // tv
 tvGoalT-=dt;if(tvGoalT<=0){tvGoalT=rnd(45,90);const t=Math.random()<.5?0:1;W.tv[t]++;emitEv({k:'goal',t});}
 // broadcast
 snapT-=dt;if(snapT<=0&&NET.mode==='host'){snapT=1/15;bcast({t:'s',w:W});}
}

const BUBBLES=[];
function bubble(obj3d,txt,yOff){const s=textSprite(txt,{fs:36,bg:'rgba(255,255,255,.92)',col:'#111',size:.2});obj3d.add(s);s.position.y=yOff;BUBBLES.push({s,obj3d,t:4});}

let tvFlash=0;
function onEv(ev){
 if(ev.to&&ev.to!==NET.myId)return;
 if(ev.k==='toast')toast(ev.txt);
 if(ev.k==='say'){if(ev.who==='w'&&waiterC){bubble(waiterC.headG,ev.txt,.35);if(dist2(waiterC.root.position)<14)say(ev.txt);}}
 if(ev.k==='sfx'){let pos=ev.pos;if(ev.pid){const a=avatarOf(ev.pid);if(a)pos=a.root.position;}sfx(ev.n,pos&&{x:pos.x,z:pos.z});}
 if(ev.k==='chat'){const p=W.players[ev.pid];if(!p)return;chatLog(HEROES[p.h].name+': '+ev.txt);const a=avatarOf(ev.pid);if(a&&ev.pid!==NET.myId)bubble(a.headG,ev.txt,.35);sfx('pop');}
 if(ev.k==='paid'){sfx('kaching');alert2(ev.who+' bayar RM'+ev.amt.toFixed(2),'Terima kasih boss, datang lagi! 🙏',5000);say('Terima kasih boss, datang lagi!');setTimeout(()=>{if(ME.seat<0)sitDown(ME.hero)},1500);}
 if(ev.k==='roulette')showRoulette(ev.names,ev.win);
 if(ev.k==='pet'){const c=catCs[ev.i];if(c){const p=c.g.position.clone();p.y+=.5;heart(p);sfx('purr',c.g.position);}}
 if(ev.k==='goal'){tvFlash=4;sfx(Math.random()<.6?'cheer':'groan',{x:3,z:-3});}
}
function dist2(p){return Math.hypot(p.x-camera.position.x,p.z-camera.position.z);}

/* ---------- roulette UI ---------- */
function showRoulette(names,win){const M=$('#rouM');M.classList.remove('hid');unlock();const cv=$('#wheel'),g=cv.getContext('2d'),n=names.length,cols=['#ffd23f','#5dff8a','#ff5d7a','#5db8ff','#c27dff'];
 const seg=TAU/n,final=TAU*6+(TAU-(win+.5)*seg)-Math.PI/2;let t0=performance.now();sfx('spin');$('#rouTxt').textContent='SIAPA BAYAR?';
 (function draw(){const k=Math.min(1,(performance.now()-t0)/4000),e=1-Math.pow(1-k,3),a=final*e;g.clearRect(0,0,360,360);
  for(let i=0;i<n;i++){g.fillStyle=cols[i%5];g.beginPath();g.moveTo(180,180);g.arc(180,180,170,a+i*seg,a+(i+1)*seg);g.fill();g.save();g.translate(180,180);g.rotate(a+(i+.5)*seg);g.fillStyle='#111';g.font='bold 26px Rajdhani';g.fillText(names[i],50,9);g.restore();}
  g.fillStyle='#fff';g.beginPath();g.moveTo(180,2);g.lineTo(166,30);g.lineTo(194,30);g.fill();
  if(k<1)requestAnimationFrame(draw);else{$('#rouTxt').textContent=names[win]+' BELANJA! 💸';sfx('ding');setTimeout(()=>M.classList.add('hid'),2200);}})();}

/* ---------- local player ---------- */
const ME={hero:0,x:0,y:0,z:3,yaw:Math.PI,pitch:0,vy:0,seat:-1,em:null,emT:0,ground:true,walkT:0,moving:0};
const KEYS={};let LOOK={x:0,y:0},MOVE={x:0,y:0},locked=false,inGame=false,modal=false;
const AV={};let waiterC=null;const catCs=[];
function avatarOf(id){return id===NET.myId?myC:AV[id];}
let myC=null;

 if(w.m!=='taking'&&!$('#orderM').classList.contains('hid'))closeModals();
 // cats
 W.cats.forEach((c,i)=>{const k=catCs[i];if(!k)return;const g=k.g;const mv=Math.hypot(g.position.x-c.x,g.position.z-c.z);g.position.x=lerp(g.position.x,c.x,.3);g.position.z=lerp(g.position.z,c.z,.3);let d=c.ry-g.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));g.rotation.y+=d*.2;k.t+=dt;const s=mv>.01?Math.sin(k.t*14)*.5:0;k.legs[0].rotation.x=k.legs[3].rotation.x=s;k.legs[1].rotation.x=k.legs[2].rotation.x=-s;k.tail.rotation.z=Math.sin(k.t*2)*.4;g.position.y=c.m==='steal'&&mv<.01?.6:0;});
 // plates
 const seen={};for(const id in W.plates){const pl=W.plates[id],pp=W.players[id];if(!pp)continue;seen[id]=1;let o=plateObjs[id];
  const key=pl.f+'|'+pl.d+'|'+pl.di+'|'+pl.db;if(!o||o.key!==key){if(o){scene.remove(o.g)}const g=new THREE.Group();const s=SEATS[pp.h],e4=pp.h===4;g.position.set(TABLE.x+s[0]+(e4?(-s[0])*.55:0),.785,s[1]+(e4?0:(TABLE.z-s[1])*.55));const fm=pl.f?foodModel(pl.f):null,dm=pl.d?drinkModel(pl.d,pl.di,pl.db):null;if(fm)g.add(fm);if(dm){dm.position.set(e4?0:.2,0,e4?-.2:0);g.add(dm);}scene.add(g);o=plateObjs[id]={g,key,fm,dm};}
  if(o.fm&&o.fm.userData.top){const k=pl.fl/8;o.fm.userData.top.scale.set(.3+k*.7,Math.max(.01,k),.3+k*.7);o.fm.userData.top.visible=pl.fl>0;}
  if(o.dm&&o.dm.userData.liq){o.dm.userData.liq.scale.y=Math.max(.02,pl.dl/6);}}
 for(const id in plateObjs)if(!seen[id]){scene.remove(plateObjs[id].g);delete plateObjs[id];}
 // card + roulette prop
 cardProp.visible=!W.card&&W.bill>0;rouProp.visible=!hasXQ()&&!W.payer;rouProp.rotation.y+=dt;
 // bubbles
 for(let i=BUBBLES.length-1;i>=0;i--){const b=BUBBLES[i];b.t-=dt;if(b.t<=0){b.obj3d.remove(b.s);BUBBLES.splice(i,1);}}
 // statics
 NPCS.forEach(n=>{poseChar(n.c,n.st,dt);if(n.roti){n.c.arms[0].sh.rotation.x=-1.2+Math.sin(n.c.t*6)*.4;n.c.arms[1].sh.rotation.x=-1.2-Math.sin(n.c.t*6)*.4;}});
}
function hudTick(){
 const pay=payerId();let b=`Bil: RM${(W.bill||0).toFixed(2)}`;b+=pay?` · Bayar: ${HEROES[W.players[pay].h].name}`:' · Bayar: ? (🎡 roulette)';if(W.card===NET.myId)b+=' · 📋 Kau pegang order card';
 const wm={idle:'',toTable:'🛎️ Waiter datang...',taking:'📝 Waiter ambil order',toKitchen:'🍳 Masak...',cook:'🍳 Masak...',deliver:'🍛 Makanan sampai!',back:''}[W.waiter.m];if(wm)b+='<br>'+wm;
 const pl=W.plates[NET.myId];if(pl&&(pl.fl||pl.dl))b+=`<br>${pl.f?FMAP[pl.f][1]+' '+'▮'.repeat(pl.fl):''} ${pl.d?' · '+DMAP[pl.d][1]+' '+'▮'.repeat(pl.dl):''}`+(ME.seat>=0?(TOUCH?'':' <small>(LMB makan / RMB minum)</small>'):'');
 $('#bill').innerHTML=b;
 $('#room').innerHTML=(NET.code?`ROOM <span>${NET.code}</span><br>`:NET.mode==='solo'?'SOLO<br>':'')+'<div id="plist">'+Object.values(W.players).map(p=>'• '+HEROES[p.h].name).join('<br>')+'</div>';
 curInt=modal?null:findInt();$('#prompt').textContent=curInt?(TOUCH?curInt.t.replace(/ [ER] — /,' ⇢ '):curInt.t):'';
}

/* ---------- loop ---------- */
let last=performance.now(),fpsA=0,fpsN=0,hudT=0,tvT=0,ambT=0;
function loop(now){requestAnimationFrame(loop);let dt=Math.min(.05,(now-last)/1000);last=now;
 if(inGame){if(NET.mode!=='client')hostTick(dt);updMe(dt);syncWorld(dt);
  hudT-=dt;if(hudT<=0){hudT=.15;hudTick();}
  tvT-=dt;if(tvT<=0&&dist2({x:3,z:-3})<25){tvT=.1;drawTV(now/1000);}if(tvFlash>0)tvFlash-=dt;
  ambT-=dt;if(ambT<=0&&AC){ambT=.25;const d=dist2({x:-7.4,z:-1.2});ambG.sizzle.gain.value=.06/(1+d*d/8);ambG.chatter.gain.value=.025;}}
 else{const t=now/9000;camera.position.set(Math.sin(t)*9,3.2,6+Math.cos(t)*3);camera.lookAt(0,1.8,-4);syncWorld(dt);}
 updParts(dt);renderer.render(scene,camera);
 if(SET.fps){fpsA+=dt;fpsN++;if(fpsA>.5){$('#fps').textContent=Math.round(fpsN/fpsA)+' fps';fpsA=fpsN=0;}}}
applyGfx();requestAnimationFrame(loop);
</script>
