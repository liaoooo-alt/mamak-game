<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mamak Mayhem</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Bebas+Neue&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#05070d;font-family:Rajdhani,sans-serif;color:#fff;touch-action:none}
canvas{display:block;filter:contrast(1.08) saturate(1.22) sepia(.16) blur(.35px);transition:filter .6s}
body.wasted canvas{filter:grayscale(1) contrast(1.1) blur(.6px)}
#grade{position:fixed;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at 50% 45%,rgba(255,150,70,.07) 30%,rgba(25,10,45,.42) 100%)}
#wasted{position:fixed;left:0;right:0;top:40%;text-align:center;z-index:24;font-family:Bangers;font-size:clamp(60px,14vw,140px);color:#c41a1a;letter-spacing:4px;-webkit-text-stroke:3px #000;text-shadow:0 6px 0 #000;animation:wz 2.5s ease-out}@keyframes wz{from{transform:scale(1.6);opacity:0}}
#radar{position:absolute;left:14px;bottom:14px;width:150px;height:150px;border-radius:50%;border:4px solid #111;box-shadow:0 0 0 2px #888;background:#0008}
#saTop{position:absolute;right:14px;top:10px;text-align:right;font-family:Bangers;letter-spacing:1px;-webkit-text-stroke:1px #000;text-shadow:2px 2px 0 #000}
#saClock{font-size:34px;color:#e8e8e8}#saMoney{font-size:34px;color:#2f9a3a}

.hid{display:none!important}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#1b2a44,#05070d 70%);z-index:20;padding:16px;overflow:auto}
h1{font-family:'Bebas Neue';font-size:clamp(48px,10vw,96px);margin:0;letter-spacing:3px;color:#5dff8a;text-shadow:0 0 18px #2dff6a,0 0 40px #0a8a3a;font-style:italic}
.sub{opacity:.75;margin-bottom:24px;font-size:18px}
.btn{font-family:'Bebas Neue';font-size:26px;letter-spacing:1px;padding:10px 28px;margin:6px;border:none;border-radius:6px;background:#ffd23f;color:#111;cursor:pointer;transform:skewX(-10deg);box-shadow:0 4px 0 #a8820e}
.btn.alt{background:#2b3a55;color:#fff;box-shadow:0 4px 0 #111a2a}
.btn:active{transform:skewX(-10deg) translateY(3px);box-shadow:none}
input.code{font-family:'Bebas Neue';font-size:30px;width:150px;text-align:center;padding:6px;border-radius:6px;border:2px solid #ffd23f;background:#0b1120;color:#fff;letter-spacing:4px}
#heroes{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:980px}
.hero{width:170px;background:linear-gradient(160deg,#25365a,#101828);border:2px solid #34507f;border-radius:10px;padding:10px;cursor:pointer;transform:skewX(-4deg);transition:.15s}
.hero:hover{border-color:#ffd23f;transform:skewX(-4deg) translateY(-4px)}
.hero.taken{opacity:.35;pointer-events:none}
.hero img{width:100%;border-radius:6px;display:block}
.hero b{font-family:'Bebas Neue';font-size:30px;display:block;margin-top:6px}
.hero i{font-style:normal;color:#ffd23f;font-weight:700}
.hero p{margin:4px 0 0;font-size:14px;opacity:.85;line-height:1.15}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#cross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #0008}
#room{position:absolute;left:10px;top:8px;font-weight:700;font-size:16px;text-shadow:0 1px 2px #000;pointer-events:auto}
#room span{color:#ffd23f;font-family:'Bebas Neue';font-size:24px;letter-spacing:2px}
#plist{font-size:14px;opacity:.9}
#bill{position:absolute;left:10px;bottom:10px;background:#000a;padding:8px 12px;border-left:4px solid #ffd23f;font-weight:700;font-size:16px;transform:skewX(-6deg)}
#prompt{position:absolute;left:50%;top:62%;transform:translateX(-50%);background:#000b;padding:6px 14px;border-radius:4px;font-weight:700;font-size:18px;white-space:nowrap}
#prompt:empty{display:none}
#hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-size:14px;opacity:.75;text-shadow:0 1px 2px #000;text-align:center}
#toasts{position:absolute;right:10px;top:8px;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.toast{background:#000b;padding:5px 12px;border-right:4px solid #5dff8a;font-weight:700;animation:tin .25s}
@keyframes tin{from{transform:translateX(30px);opacity:0}}
#banner{position:absolute;left:0;right:0;top:22%;text-align:center;font-family:Bangers;letter-spacing:2px;-webkit-text-stroke:2px #000;font-size:clamp(34px,7vw,70px);color:#ffd23f;text-shadow:0 0 12px #000,0 3px 0 #a8820e;font-style:italic}
#banner small{display:block;font-family:Rajdhani;font-size:22px;color:#fff;font-style:normal}
#chatlog{position:absolute;left:10px;bottom:84px;width:min(360px,60vw);font-size:15px;font-weight:700;text-shadow:0 1px 2px #000}
#chatlog div{animation:tin .2s}
#chatin{position:absolute;left:10px;bottom:56px;width:min(360px,70vw);pointer-events:auto;font-family:Rajdhani;font-size:16px;padding:6px;border:2px solid #ffd23f;background:#000c;color:#fff;border-radius:4px}
#fps{position:absolute;right:10px;bottom:6px;font-size:12px;opacity:.7}
.modal{position:fixed;inset:0;z-index:30;background:#000a;display:flex;align-items:center;justify-content:center;padding:10px}
.panel{background:linear-gradient(160deg,#1c2a46,#0c1322);border:2px solid #ffd23f;border-radius:10px;padding:14px 18px;max-width:760px;width:100%;max-height:92vh;overflow:auto}
.panel h2{font-family:'Bebas Neue';font-size:38px;margin:0 0 6px;color:#ffd23f;letter-spacing:1px}
.cat{font-family:'Bebas Neue';font-size:22px;margin:10px 0 4px;color:#5dff8a}
.items{display:flex;flex-wrap:wrap;gap:6px}
.it{background:#26385e;border:2px solid transparent;border-radius:6px;padding:5px 9px;cursor:pointer;font-weight:700;font-size:15px}
.it.sel{border-color:#ffd23f;background:#4a3d12}
.it small{color:#ffd23f;margin-left:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.set label{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0;font-weight:700}
.set input[type=range]{width:55%}
#touch{position:fixed;inset:0;z-index:6;pointer-events:none}
.tb{position:absolute;pointer-events:auto;border-radius:50%;background:#0008;border:2px solid #fff6;display:flex;align-items:center;justify-content:center;font-size:calc(var(--bs)*.42);width:var(--bs);height:var(--bs);color:#fff;font-family:'Bebas Neue'}
.tb:active,.tb.on{background:#ffd23f99}
#stick{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid #fff5;display:none;pointer-events:none}
#stick i{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#fff6}
#cross.hm{animation:hm .25s}@keyframes hm{0%{box-shadow:0 0 0 2px #0008,0 0 0 9px #ff3b3b;}}
#vig{position:absolute;inset:0;opacity:0;background:radial-gradient(circle,transparent 45%,#c00 120%);transition:opacity .1s}
#fog{position:absolute;inset:0;opacity:0;background:#cfc8ff;transition:opacity .3s}
.ftxt{position:absolute;left:50%;top:40%;transform:translateX(-50%);font-family:Bangers;letter-spacing:1px;-webkit-text-stroke:1.5px #000;font-size:42px;text-shadow:0 2px 0 #000;animation:fu 1.2s forwards;white-space:nowrap}@keyframes fu{to{transform:translate(-50%,-60px);opacity:0}}
#fhud{position:absolute;inset:0}#hpw{position:absolute;left:14px;bottom:14px;width:min(260px,30vw)}#hpn{font-family:Bangers;font-size:22px;letter-spacing:1px;-webkit-text-stroke:1px #000;text-shadow:2px 2px 0 #000}#hpb{height:14px;background:#3a0a0a;border:3px solid #000}#hpb i{display:block;height:100%;background:#b4191d;transition:width .15s}#hpx{font-weight:700;font-size:15px;margin-top:3px;text-shadow:0 1px 2px #000}
#ultw{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:70px;height:70px;border-radius:50%;padding:5px;background:#0006}#ultr{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue';font-size:20px}#ultw b{position:absolute;top:-16px;left:28px;font-family:'Bebas Neue'}#ultw.full{animation:pu .8s infinite}@keyframes pu{50%{box-shadow:0 0 22px #ffd23f}}
#abils{position:absolute;right:12px;bottom:12px;display:flex;gap:6px}.ab{position:relative;width:64px;height:58px;background:#000a;border:2px solid #fff5;border-radius:6px;overflow:hidden;transform:skewX(-8deg);text-align:center;padding-top:4px}.ab b{display:block;font-family:'Bebas Neue';font-size:17px;color:#ffd23f}.ab span{font-size:11px;font-weight:700;line-height:1}.ab u{position:absolute;left:0;right:0;bottom:0;background:#000c;height:0}
body.touch #hpw{bottom:auto;top:60px}
#hotbar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:4px;pointer-events:auto}
.hs{position:relative;width:min(58px,9vw);height:min(58px,9vw);background:#0009;border:3px solid #222;outline:2px solid #777;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
.hs.sel{outline:3px solid #ffd23f;background:#3a300c}
.hs .i{font-size:min(26px,4.5vw);line-height:1}.hs .n{font-size:10px;font-weight:700;white-space:nowrap;max-width:100%;overflow:hidden}.hs .k{position:absolute;left:3px;top:1px;font-family:Bangers;font-size:13px;color:#ffd23f;-webkit-text-stroke:.5px #000}
.hs u{position:absolute;left:0;right:0;bottom:0;background:#000b;height:0}.hs .cdn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:Bangers;font-size:20px;color:#fff}
.hs.ult .f{position:absolute;left:0;right:0;bottom:0;background:#ffd23f55}.hs.ready{animation:pu .8s infinite}@keyframes pu{50%{box-shadow:0 0 22px #ffd23f}}
body.touch #hotbar{bottom:auto;top:8px}
#mvp{position:fixed;inset:0;z-index:25;background:#000c;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700}#mvp h1{font-family:Bangers;letter-spacing:3px;-webkit-text-stroke:2px #000;color:#ffd23f;text-shadow:0 0 16px #a8820e}#mvp .aw{display:flex;gap:14px;align-items:center;margin:4px;font-size:20px}#mvp .aw b{color:#5dff8a}#mvp .aw i{opacity:.7;font-style:normal}#mvp table{margin-top:14px;font-size:18px}#mvp td{padding:2px 12px}
#wheel{width:min(80vw,360px);height:min(80vw,360px)}
</style>
</head>
<body>
<div id="start" class="scr">
  <h1>MAMAK MAYHEM</h1>
  <div class="sub">AZ Imran Bistro · Buka 24 Jam</div>
  <div id="stMain">
    <div class="row" style="justify-content:center"><button class="btn" id="bHost">HOST</button><button class="btn alt" id="bSolo">PLAY SOLO</button></div>
    <div class="row" style="justify-content:center;margin-top:14px"><input class="code" id="codeIn" maxlength="4" placeholder="CODE" inputmode="numeric"><button class="btn alt" id="bJoin">JOIN</button></div>
  </div>
  <div id="stMsg" style="margin-top:14px;font-weight:700;min-height:22px"></div>
</div>
<div id="pick" class="scr hid">
  <h1 style="font-size:56px">PILIH HERO</h1>
  <div class="sub" id="pickSub"></div>
  <div id="heroes"></div>
</div>
<div id="hud" class="hid">
  <div id="cross"></div>
  <div id="room"></div>
  <div id="toasts"></div>
  <div id="banner"></div>
  <div id="chatlog"></div>
  <div id="bill"></div>
  <div id="prompt"></div>
  <div id="hint"></div>
  <div id="fps"></div>
  <div id="hotbar"></div>
  <div id="vig"></div><div id="fog"></div><div id="fhud" class="hid"></div>
</div>
<div id="mvp" class="hid"></div>
<div id="grade"></div><div id="wasted" class="hid">WASTED</div>
<input id="chatin" class="hid" maxlength="80" placeholder="Cakap something... (Enter)">
<div id="touch" class="hid"><div id="stick"><i></i></div></div>
<div id="orderM" class="modal hid"><div class="panel">
  <h2>BOSS, MAKAN APA?</h2><div id="menuList"></div>
  <div class="row"><b>Minuman:</b><span class="it" id="opHot">Panas</span><span class="it" id="opIce">Ais</span><span class="it" id="opGlass">Gelas</span><span class="it" id="opBag">Ikat Tepi</span></div>
  <div class="row"><button class="btn" id="bOrder">ORDER!</button><button class="btn alt" id="bNo">TAK APA</button><span id="oSum" style="font-weight:700"></span></div>
</div></div>
<div id="emoteM" class="modal hid"><div class="panel" style="max-width:420px"><h2>EMOTE</h2><div class="items" id="emList"></div></div></div>
<div id="setM" class="modal hid"><div class="panel set" style="max-width:480px">
  <h2>SETTINGS</h2>
  <label>Mouse sensitivity <input type="range" id="sSens" min="0.2" max="3" step="0.05"></label>
  <label>Touch look sensitivity <input type="range" id="sTSens" min="0.2" max="3" step="0.05"></label>
  <label>Field of view <input type="range" id="sFov" min="60" max="110" step="1"></label>
  <label>Volume <input type="range" id="sVol" min="0" max="1" step="0.05"></label>
  <label>Touch button size <input type="range" id="sBtn" min="44" max="96" step="2"></label>
  <label>Invert Y <input type="checkbox" id="sInv"></label>
  <label>Render resolution <input type="range" id="sRes" min="300" max="900" step="30"></label>
  <label>Show FPS <input type="checkbox" id="sFps"></label>
  <div class="row"><button class="btn" id="bSetOk">RESUME</button><button class="btn alt" id="bLeave">LEAVE</button></div>
  <div style="opacity:.7;font-size:14px">PC: WASD move · Shift sprint · Space jump · E interact · G call waiter · LMB eat · RMB drink · 1-6 emotes · Enter chat · Esc menu</div>
</div></div>
<div id="rouM" class="modal hid"><div style="text-align:center"><canvas id="wheel" width="360" height="360"></canvas><div id="rouTxt" style="font-family:'Bebas Neue';font-size:40px;color:#ffd23f"></div></div></div>

function noise(d,v,ft,ff,q,dl,ff2,dest,att){const t=AC.currentTime+(dl||0),s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;s.loop=true;f.type=ft;f.frequency.setValueAtTime(ff,t);if(ff2)f.frequency.exponentialRampToValueAtTime(ff2,t+d);f.Q.value=q||1;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+(att||.005));g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(dest);s.start(t,Math.random());s.stop(t+d+.05);}

function sfx(n,pos){if(!AC||!SFX[n])return;let v=1,pan=0;if(pos){const dx=pos.x-camera.position.x,dz=pos.z-camera.position.z,d=Math.hypot(dx,dz);v=1/(1+d*d/40);if(v<.02)return;const a=Math.atan2(dx,dz)-Math.atan2(-Math.sin(ME.yaw),-Math.cos(ME.yaw));pan=Math.sin(a)*.8*Math.min(1,d/2)*-1;}if(!isFinite(pan))pan=0;if(!isFinite(v))v=1;SFX[n](out(v,pan));}

 const o={...s,p:new V3(...s.p),v:new V3(...s.v),t:0,m:shotMesh(s.k),hit:new Set(),bn:0};o.m.position.copy(o.p);

 const E=ents();
 SHOTS.forEach((o,id)=>{if(o.dead){o.t+=dt;if(o.t>5)SHOTS.delete(id);return;}
  const d=SK[o.k];o.t+=dt;const steps=Math.max(1,Math.ceil(o.v.length()*dt/.25)),h=dt/steps;
  for(let i=0;i<steps&&!o.dead;i++){o.p.addScaledVector(o.v,h);o.v.y-=d.g*h;
   if(o.k==='ball'&&o.p.y<d.r){o.p.y=d.r;o.v.y=Math.abs(o.v.y)*.55;o.v.x*=.75;o.v.z*=.75;if(++o.bn>3){killShot(o);break;}sfx('thud',o.p);}

   for(const e of E){if(e.id===o.o||(e.o&&e.o===o.o)||o.hit.has(e.id))continue;if(!capHit(o.p.x,o.p.y,o.p.z,e,d.r))continue;o.hit.add(e.id);

    if(o.k==='ball'){o.v.multiplyScalar(-.4);o.v.y=4;}else{killShot(o);break;}}
   npcHit(o.p,.5);kickFurn(o.p.x,o.p.z,.5,1.5,1);}
  if(o.dead)return;

  o.m.position.copy(o.p);if(o.k==='card'||o.k==='phone')o.m.rotation.y+=dt*25;if(o.k==='arrow'||o.k==='bottle')o.m.lookAt(o.p.clone().add(o.v));if(o.k==='bottle')o.m.rotation.x+=dt*12;
  if(o.line){const op=posOf(o.o);if(op){const a=o.line.geometry.attributes.position;a.setXYZ(0,op.x,op.y+1.2,op.z);a.setXYZ(1,o.p.x,o.p.y,o.p.z);a.needsUpdate=true;}}});}

function resolveBullet(s){const p=new V3(...s.p),d=new V3(...s.v).normalize();let end=60;
 for(let t=0;t<60;t+=.25){const x=p.x+d.x*t,y=p.y+d.y*t,z=p.z+d.z*t;if(solidAt(x,y,z)){end=t;break;}}
 let best=null,bt=end;for(const e of ents()){if(e.id===s.o||(e.o&&e.o===s.o))continue;for(let t=.5;t<bt;t+=.2){const x=p.x+d.x*t,y=p.y+d.y*t,z=p.z+d.z*t;if(capHit(x,y,z,e,.05)){if(t<bt){bt=t;best=e;}break;}}}

function dmgIn(amt,by,opt){opt=opt||{};if(!ME.alive||!fightOn()||amt<=0&&!opt.stun)return;
 const isMelee=opt.melee,isShot=opt.shot;
 if(ME.hero===2&&(isMelee||isShot)&&(ME.parry>0||(ME.ultT>0&&ME.autoP<=0))){if(ME.parry<=0)ME.autoP=.3;ME.parry=0;parryFx(by,opt);return;}

 else{ME.hp-=amt;}
 if(amt>40)ME.heal=0;ME.lastHit=0;$('#vig').style.opacity=Math.min(.8,.25+amt/80);
 reportHit(amt,by,opt);
 if(!ME.mech&&ME.hp<=0){ME.hp=0;ME.alive=false;ME.horse=0;act({k:'died',by});spectIdx=0;$('#vig').style.opacity=.6;document.body.classList.add('wasted');$('#wasted').classList.remove('hid');sfx('wasted');slowmo=1.2;setTimeout(()=>{document.body.classList.remove('wasted');$('#wasted').classList.add('hid');},3500);}}

/* ---- outgoing damage ---- */
function sendDmg(to,amt,opt){opt=opt||{};const a=Math.round(amt*(amt>0?ME.dmgMul:1));act({k:'dmg',to,amt:a,by:NET.myId,o:opt});}
function meleeHit(range,arc,dmg,opt,maxN){const f=aimDir();f.y=0;f.normalize();let n=0;
 for(const e of ents()){if(e.id===NET.myId||(e.o===NET.myId))continue;const dx=e.x-ME.x,dz=e.z-ME.z,d=Math.hypot(dx,dz);if(d>range+e.r)continue;if(d>.3&&(dx*f.x+dz*f.z)/d<Math.cos(arc))continue;
  const o=Object.assign({melee:1},opt||{});if(o.kbF){o.kb=[dx/(d||1)*o.kbF,dz/(d||1)*o.kbF];delete o.kbF;}sendDmg(e.id,dmg,o);n++;if(maxN&&n>=maxN)break;}
 npcHit(new V3(ME.x+f.x*range*.6,1,ME.z+f.z*range*.6),range*.6);kickFurn(ME.x+f.x,ME.z+f.z,range*.7,4,2);return n;}
function meleeAround(r,dmg,opt,tag){const hit=[];for(const e of ents()){if(e.id===NET.myId||e.o===NET.myId)continue;const dx=e.x-ME.x,dz=e.z-ME.z,d=Math.hypot(dx,dz);if(d>r+e.r)continue;if(tag){tag[e.id]=tag[e.id]||0;if(tag[e.id]>0)continue;tag[e.id]=.8;}const o=Object.assign({},opt||{});if(o.kbF){o.kb=[dx/(d||1)*o.kbF,dz/(d||1)*o.kbF];delete o.kbF;}sendDmg(e.id,dmg,o);hit.push(e.id);}npcHit(new V3(ME.x,1,ME.z),r);return hit;}
function nearestFront(maxD,cosMin){const f=aimDir();f.y=0;f.normalize();let best=null,bd=maxD;for(const e of ents()){if(e.id===NET.myId||e.o===NET.myId)continue;const dx=e.x-ME.x,dz=e.z-ME.z,d=Math.hypot(dx,dz);if(d<bd&&d>.01&&(dx*f.x+dz*f.z)/d>cosMin){bd=d;best=e;}}return best?{e:best,d:bd}:null;}
function groundAim(maxD){const d=aimDir(),p=camera.position;if(d.y<-.05){const t=-p.y/d.y;if(t<maxD)return{x:p.x+d.x*t,z:p.z+d.z*t};}const f=new V3(d.x,0,d.z).normalize();return{x:p.x+f.x*Math.min(maxD,12),z:p.z+f.z*Math.min(maxD,12)};}
function shoot(k,speed,dmg,opt){opt=opt||{};const d=aimDir();if(opt.spread){d.x+=rnd(-opt.spread,opt.spread);d.y+=rnd(-opt.spread,opt.spread);d.z+=rnd(-opt.spread,opt.spread);d.normalize();}if(opt.up)d.y+=opt.up;
 const p=camera.position.clone().addScaledVector(d,.5);p.y-=.12;const v=d.clone().normalize().multiplyScalar(speed);
 const s={id:NET.myId+'.'+(++shotN),k,o:NET.myId,p:p.toArray().map(f2),v:v.toArray().map(f2),dmg:Math.round(dmg*ME.dmgMul)};spawnShot(s);act({k:'shot',s});vmKick();}

 switch(a.k){
 case 'trigger':if(!W.fight){W.fight={st:'cd',t:3,stats:{},by:nm};W.bots={};const tk=new Set(Object.values(W.players).map(q=>q.h));for(let h=0;h<5;h++)if(!tk.has(h)){const s=seatPos(h);const mx=h===0?450:250;W.bots[h]={x:s.x+Math.sin(SEATS[h][2])*.7,z:s.z+Math.cos(SEATS[h][2])*.7,ry:0,hp:mx,mx,al:1,cd:rnd(1,2),mv:0,stun:0,st:rnd(0,3)};}

 case 'car':if(!fightOn())return true;emitEv({k:'carwarn',x:a.x,z:a.z,by:pid});setTimeout(()=>{if(!fightOn())return;emitEv({k:'boom',p:[a.x,.5,a.z],r:3.5,dmg:90,by:pid,kind:'car'});hostBoom([a.x,.5,a.z],3.5,90,pid);},1300);return true;

 case 'pack':{const pk=W.packs&&W.packs[a.i];if(pk&&pk.up){pk.up=0;pk.t=30;emitEv({k:'heal',to:pid,amt:75});}return true;}

function stat(id,n,v){if(!W.fight||!id)return;const s=W.fight.stats[id]=W.fight.stats[id]||{n:nameOf(id),k:0,d:0,dmg:0,taken:0,parry:0};s[n]=(s[n]||0)+v;}
function hostDmg(to,amt,by,opt){if(!to)return;opt=opt||{};
 if(to[0]==='b'){const h=to.slice(1),b=W.bots&&W.bots[h];if(!b||!b.al)return;if(opt.stun)b.stun=Math.max(b.stun,opt.stun);if(opt.kb){b.x+=opt.kb[0]*.15;b.z+=opt.kb[1]*.15;}if(opt.pull){b.x=lerp(b.x,opt.pull.x,.8);b.z=lerp(b.z,opt.pull.z,.8);}
  if(amt>0){b.hp-=amt;stat(by,'dmg',amt);stat(to,'taken',amt);emitEv({k:'hitfx',tg:to,amt,by,p:[f2(b.x),1.8,f2(b.z)]});if(b.hp<=0){b.al=0;stat(to,'d',1);stat(by,'k',1);emitEv({k:'kill',by,vic:to});}}return;}
 if(to[0]==='s'){const s=W.sums&&W.sums.find(q=>'s'+q.id===to);if(!s||amt<=0)return;s.hp-=amt;emitEv({k:'hitfx',tg:to,amt,by,p:[f2(s.x),1,f2(s.z)]});if(s.hp<=0)W.sums=W.sums.filter(q=>q!==s);return;}
 emitEv({k:'dmg',to,amt,by,o:opt});}
function hostBoom(p,r,dmg,by){if(W.bots)for(const h in W.bots){const b=W.bots[h];if(!b.al||'b'+h===by)continue;const d=Math.hypot(b.x-p[0],b.z-p[2]);if(d<r)hostDmg('b'+h,dmg*(1-d/r*.5),by,{kb:[(b.x-p[0])/(d||1)*6,(b.z-p[2])/(d||1)*6]});}
 (W.sums||[]).slice().forEach(s=>{if(s.o===by)return;if(Math.hypot(s.x-p[0],s.z-p[2])<r)hostDmg('s'+s.id,dmg,by,{});});}
const BOT_R=[2.2,10,1.8,8,7],BOT_S=[3.2,4,4.5,4,4.2];
function botShot(h,k,b,t,speed,dmg,spread){const p=new V3(b.x,(h==0?2.4:HEROES[h].h*.85),b.z);const tp=new V3(t.x,t.y+t.h*.6,t.z);const d=tp.sub(p).normalize();d.x+=rnd(-spread,spread);d.y+=rnd(-spread,spread);d.z+=rnd(-spread,spread);d.normalize();
 const s={id:'b'+h+'.'+(++shotN),k,o:'b'+h,p:p.toArray().map(f2),v:(k==='bullet'?d:d.multiplyScalar(speed)).toArray().map(v=>Math.round(v*1000)/1000),dmg};emitEv({k:'shot',s});}
function botCollide(b){const r=.35;for(const c of COLS){if(c.f)continue;const nx=clamp(b.x,c.x0,c.x1),nz=clamp(b.z,c.z0,c.z1),dx=b.x-nx,dz=b.z-nz,d=dx*dx+dz*dz;if(d<r*r&&d>1e-6){const dd=Math.sqrt(d);b.x=nx+dx/dd*r;b.z=nz+dz/dd*r;}}b.x=clamp(b.x,-30,28);b.z=clamp(b.z,-11.5,21);}
function fightHost(dt){const F=W.fight;if(!F)return;
 if(F.st==='cd'){F.t-=dt;if(F.t<=0){F.st='on';F.t=0;emitEv({k:'fightstart'});W.waiter.m='hide';W.waiter.path=[[4.8,-4],[4.8,-10.8]];W.cats.forEach(c=>{c.m='flee';c.tx=rnd(-20,20);c.tz=rnd(15,20);});}return;}
 if(F.st==='on'){F.t+=dt;
  const E=ents();
  if(W.bots)for(const h in W.bots){const b=W.bots[h];b.mv=0;if(!b.al)continue;b.stun-=dt;b.cd-=dt;if(b.stun>0)continue;
   b.rt=(b.rt||0)-dt;const C=E.filter(e=>e.id!=='b'+h&&e.id[0]!=='s').map(e=>({e,d:Math.hypot(e.x-b.x,e.z-b.z)})).sort((a,c)=>a.d-c.d);if(!C.length)continue;if(b.rt<=0||!C.find(c=>c.e.id===b.tg)){b.rt=rnd(3,6);b.tg=C[Math.random()<.6?0:Math.min(1,C.length-1)].e.id;}const bc=C.find(c=>c.e.id===b.tg);let best=bc.e,bd=bc.d;
   const dx=best.x-b.x,dz=best.z-b.z,R=BOT_R[h],sp=BOT_S[h];b.ry=Math.atan2(dx,dz);b.st+=dt;
   if(bd>R){b.x+=dx/bd*sp*dt;b.z+=dz/bd*sp*dt;b.mv=sp;}else{const s=Math.sin(b.st*.9)>0?1:-1;b.x+=-dz/bd*s*sp*.5*dt;b.z+=dx/bd*s*sp*.5*dt;b.mv=sp*.5;}botCollide(b);
   if(b.cd<=0){const id=best.id;
    if(h==0&&bd<2.8){b.cd=1.1;hostDmg(id,14,'b0',{melee:1,kb:[dx/bd*5,dz/bd*5]});emitEv({k:'sfx',n:'punch',pos:{x:b.x,z:b.z}});}
    if(h==1&&bd<16){b.cd=.7;botShot(1,'bullet',b,best,0,7,.08);}
    if(h==2){if(bd<6&&bd>1.8){b.x=best.x-dx/bd*1.2;b.z=best.z-dz/bd*1.2;}if(Math.hypot(best.x-b.x,best.z-b.z)<2.2){b.cd=.7;hostDmg(id,9,'b2',{melee:1});emitEv({k:'sfx',n:'punch',pos:{x:b.x,z:b.z}});}}
    if(h==3&&bd<14){b.cd=.5;botShot(3,'card',b,best,30,5,.06);}
    if(h==4&&bd<12){b.cd=2.2;botShot(4,'ball',b,best,18,28,.05);}}}
  (W.sums||[]).forEach(s=>{s.life-=dt;s.cd-=dt;let best=null,bd=1e9;for(const e of E){if(e.id===s.o||e.o===s.o||e.id==='s'+s.id)continue;const d=Math.hypot(e.x-s.x,e.z-s.z);if(d<bd){bd=d;best=e;}}
   if(best){const dx=best.x-s.x,dz=best.z-s.z;s.ry=Math.atan2(dx,dz);
    if(s.k==='turret'&&bd<14&&s.cd<=0){s.cd=1.1;const p=new V3(s.x,.8,s.z),v=new V3(best.x,best.y+best.h*.6,best.z).sub(p).normalize().multiplyScalar(9);emitEv({k:'shot',s:{id:'s'+s.id+'.'+(++shotN),k:'seed',o:s.o,p:p.toArray().map(f2),v:v.toArray().map(f2),dmg:10}});}
    if(s.k==='cicak'){if(bd>1.3){s.x+=dx/bd*5*dt;s.z+=dz/bd*5*dt;}else if(s.cd<=0){s.cd=.8;hostDmg(best.id,12,s.o,{stun:.15});emitEv({k:'zap',x:s.x,z:s.z,tx:best.x,tz:best.z});}}}});
  W.sums=(W.sums||[]).filter(s=>s.life>0);

  return;}
 if(F.st==='end'){F.t-=dt;if(F.t<=0){W.fight=null;W.bots=null;W.sums=null;W.packs=null;W.waiter.m='back';W.waiter.path=[[4.8,-10.8]];W.cats.forEach(c=>{c.m='wander';c.t=2;});emitEv({k:'reset'});}}}

function showMVP(ev){const st=Object.values(ev.stats||{});st.sort((a,b)=>b.k-a.k||b.dmg-a.dmg);const top=st[0];const most=(n)=>st.slice().sort((a,b)=>b[n]-a[n])[0];
 const aw=[];if(top)aw.push(['🏆 MVP',top.n,top.k+' kills · '+Math.round(top.dmg)+' dmg']);const t=most('taken');if(t&&t.taken)aw.push(['🥴 Kena Bully',t.n,Math.round(t.taken)+' dmg taken']);const p=most('parry');if(p&&p.parry)aw.push(['🥋 Tukang Parry',p.n,p.parry+' parries']);
 let sips=0,who='';for(const id in W.plates){const pl=W.plates[id];if(pl.d&&6-pl.dl>sips){sips=6-pl.dl;who=nameOf(id);}}if(sips)aw.push(['🍵 Most Teh Tarik Drunk',who,sips+' sips']);
 $('#mvp').innerHTML=`<h1 style="font-size:64px">${ev.win} MENANG!</h1>`+aw.map(a=>`<div class="aw"><b>${a[0]}</b><span>${a[1]}</span><i>${a[2]}</i></div>`).join('')+'<table>'+st.map(s=>`<tr><td>${s.n}</td><td>${s.k} K</td><td>${s.d} D</td><td>${Math.round(s.dmg)} dmg</td></tr>`).join('')+'</table>';
 $('#mvp').classList.remove('hid');sfx('cheer');if(ev.wid===NET.myId)say('Champion!');}

/* ---- fight HUD ---- */
const ABIL={0:[['LMB','Punch / Phone','p'],['Shift','Dash','dash'],['E','Jump / Call GF','sj'],['H','Vape','heal'],['Q','GF Rage','ult']],
 1:[['LMB','Gun','p'],['RMB','Grenade','g'],['E','Chilli Turret','tur'],['Shift','Honda Drop','car'],['C','Vodka','vodka'],['H','Vape','heal'],['Q','Tan Xiao Gao','ult']],
 2:[['1/2/3','Fist·Lasso·Bow','p'],['RMB','Roundhouse','k'],['V','Block/Parry','parry'],['Shift','BJJ Takedown','td'],['E','Kuda','horse'],['H','Vape','heal'],['Q','Grandmaster','ult']],
 3:[['LMB','Cards','p'],['Shift','Vape Cloud','cloud'],['E','Cicak Kilat','cicak'],['H','Vape','heal'],['Q','Card Storm','ult']],
 4:[['LMB','Spike','p'],['RMB','Parang','s'],['Shift','Dash','dash'],['V','Block','block'],['H','Vape','heal'],['Q','Spike Frenzy','ult']]};
function buildFightHud(){$('#bill').classList.add('hid');const f=$('#fhud');f.classList.remove('hid');f.innerHTML='<div id="hpw"><div id="hpn"></div><div id="hpb"><i></i></div><div id="hpx"></div></div>';}
function fightHud(){if(!W.fight||$('#fhud').classList.contains('hid'))return;
 const mech=ME.mech,cur=mech?ME.mhp:ME.hp,mx=mech?KIT[0].mech+(ME.rage?300:0):ME.max;
 $('#hpn').textContent=(ME.alive?Math.ceil(cur)+' / '+mx:'KO — spectating '+(spectName||''))+(ME.horse>0?'  🐴 '+Math.ceil(ME.horseHp):'');$('#hpb i').style.width=clamp(cur/mx,0,1)*100+'%';$('#hpb i').style.background=mech?'#ff6fa8':'#5dff8a';
 let x=[];if(ME.hero===1)x.push(ME.reload>0?'RELOADING':'🔫 '+ME.ammo+'/12');if(ME.hero===2)x.push('Mode: '+['','👊 Fist','🪢 Lasso','🏹 Bow'][ME.mode]);if(ME.hero===0&&!mech&&ME.gfCd>0)x.push('GF in '+Math.ceil(ME.gfCd)+'s');if(ME.vodka>0)x.push('🍸');if(ME.ultT>0)x.push('ULT '+Math.ceil(ME.ultT)+'s');$('#hpx').textContent=x.join(' · ');


 if(!fightOn())$('#fog').style.opacity=0;else{const f=$('#fog');f.style.opacity=Math.max(0,(+f.style.opacity||0)-.05);}
 $('#vig').style.opacity=Math.max(ME.alive?0:.35,(+$('#vig').style.opacity||0)-.06);}
let spectName='';
function spectCam(){const L=ents().filter(e=>e.id!==NET.myId&&e.id[0]!=='s');if(!L.length)return false;const e=L[spectIdx%L.length];spectName=nameOf(e.id);const D=e.h>2?6.5:4;camera.position.set(e.x+Math.sin(ME.yaw)*D,e.y+e.h+1.6,e.z+Math.cos(ME.yaw)*D);camera.lookAt(e.x,e.y+e.h*.7,e.z);return true;}

/* ---- hotbar ---- */
const ICON={0:'📱',1:'🔫',2:'🥊',3:'🃏',4:'🏐'},INAME={0:'Phone',1:'Pistol',2:'Fists',3:'Cards',4:'Volleyball'};
const AICON={g:'💣',tur:'🌶️',car:'🚗',vodka:'🍸',heal:'💨',dash:'⚡',sj:'⤴️',k:'🦵',parry:'🛡️',td:'🤼',horse:'🐴',cloud:'☁️',cicak:'🦎',s:'🔪',block:'🛡️'};
const CDMAX={p:1.4,g:6,tur:18,car:20,vodka:15,heal:12,dash:6,sj:6,k:1.2,parry:.8,td:7,horse:25,cloud:12,cicak:15,s:.45,block:3};
const AFN={p:()=>{primary(false);releasePrimary();},g:()=>secondary(),k:()=>secondary(),s:()=>secondary(),tur:()=>abilE(),sj:()=>abilE(),horse:()=>abilE(),cicak:()=>abilE(),car:()=>abilShift(),dash:()=>abilShift(),td:()=>abilShift(),cloud:()=>abilShift(),vodka:()=>abilC(),heal:()=>abilH(),parry:()=>{abilV(true);setTimeout(()=>abilV(false),300);},block:()=>abilV(true)};
let HB=[],hbSig='';
function hotSlots(){const h=ME.hero;
 if(W.fight){const L=[];ABIL[h].forEach(a=>{if(a[2]==='ult')return;if(h===2&&a[2]==='p'){[['1','🥊','Fist'],['2','🪢','Lasso'],['3','🏹','Bow']].forEach((m,i)=>L.push({k:m[0],i:m[1],n:m[2],sel:()=>ME.mode===i+1,fn:()=>{ME.mode=i+1;ME.charge=-1;},cd:'p'}));return;}
  L.push({k:a[0].replace('Shift','⇧'),i:a[2]==='p'?(h===0&&!ME.mech?'📱':h===0?'👊':ICON[h]):AICON[a[2]]||'•',n:a[1].split(' / ')[0],cd:a[2],fn:AFN[a[2]]});});
  L.push({k:'Q',i:'⭐',n:ABIL[h].find(a=>a[2]==='ult')[1],ult:1,fn:()=>abilQ()});return L;}
 const em=(e,i,n,k)=>({k,i,n,fn:()=>emote(e)});
 return[{k:'1',i:'✋',n:'Tangan',sel:()=>!EQ,fn:()=>{EQ=false;}},{k:'2',i:ICON[h],n:INAME[h],sel:()=>EQ,fn:()=>{EQ=true;toast('⚔️ '+INAME[h]+' keluar — attack to start a fight!');}},em('vape','💨','Vape','3'),em('smoke','🚬','Rokok','4'),em('tarik','🍵','Tarik','5'),em('wave','👋','Wave','6'),em('laugh','😂','Gelak','7'),em('point','👉','Point','8')];}
function hotbarTick(){const sig=(W.fight?'F':'C')+ME.hero+(ME.mech?'m':'')+(W.fight&&ME.alive?'a':'d');if(sig!==hbSig){hbSig=sig;HB=hotSlots();const el=$('#hotbar');el.innerHTML=HB.map((s,i)=>`<div class="hs${s.ult?' ult':''}" data-i="${i}"><span class="k">${s.k}</span>${s.ult?'<div class="f"></div>':''}<u></u><span class="i">${s.i}</span><span class="n">${s.n}</span><span class="cdn"></span></div>`).join('');
  el.onpointerdown=e=>{const d=e.target.closest('.hs');if(!d)return;e.preventDefault();e.stopPropagation();au();const s=HB[+d.dataset.i];if(s&&s.fn)s.fn();};}
 const ds=$('#hotbar').children;HB.forEach((s,i)=>{const d=ds[i];if(!d)return;d.classList.toggle('sel',!!(s.sel&&s.sel()));
  if(s.ult){d.querySelector('.f').style.height=(ME.ult*100)+'%';d.classList.toggle('ready',ME.ult>=1);d.querySelector('.cdn').textContent=ME.ultT>0?Math.ceil(ME.ultT):ME.ult<1?Math.floor(ME.ult*100)+'%':'';return;}
  if(s.cd){const v=ME.cd&&ME.cd[s.cd]>0?ME.cd[s.cd]:0;d.querySelector('u').style.height=v>0?Math.min(100,v/(CDMAX[s.cd]||1)*100)+'%':'0';d.querySelector('.cdn').textContent=v>1?Math.ceil(v):(s.cd==='p'&&ME.hero===1&&W.fight?(ME.reload>0?'R':ME.ammo):'');}});}
/* ---------- loop ---------- */
let last=performance.now(),fpsA=0,fpsN=0,hudT=0,tvT=0,ambT=0;
function loop(now){requestAnimationFrame(loop);let dt=Math.min(.05,(now-last)/1000);last=now;if(slowmo>0){slowmo-=dt;dt*=.35;}
 if(inGame){if(NET.mode!=='client')hostTick(dt);updMe(dt);syncWorld(dt);
  hudT-=dt;if(hudT<=0){hudT=.15;hudTick();}
  tvT-=dt;if(tvT<=0&&dist2({x:3,z:-3})<25){tvT=.1;drawTV(now/1000);}if(tvFlash>0)tvFlash-=dt;
  ambT-=dt;if(ambT<=0&&AC){ambT=.25;const d=dist2({x:-7.4,z:-1.2});ambG.sizzle.gain.value=.06/(1+d*d/8);ambG.chatter.gain.value=.025;}}
 else{const t=now/9000;camera.position.set(Math.sin(t)*9,3.2,6+Math.cos(t)*3);camera.lookAt(0,1.8,-4);syncWorld(dt);}
 updParts(dt);renderer.render(scene,camera);
 if(SET.fps){fpsA+=dt;fpsN++;if(fpsA>.5){$('#fps').textContent=Math.round(fpsN/fpsA)+' fps';fpsA=fpsN=0;}}}
applyGfx();requestAnimationFrame(loop);
</script>
